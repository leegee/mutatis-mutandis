<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
    <style>
        .line {
            stroke: currentColor;
            stroke-width: 2;
        }

        .box {
            fill: transparent;
            stroke: currentColor;
            stroke-width: 2;
            rx: 8;
            ry: 8;
        }

        .title,
        .text,
        .date {
            fill: currentColor;
            text-anchor: middle;
            font-family: serif;
        }

        .title {
            font-size: 16px;
        }

        .text {
            font-size: 14px;
        }

        .date {
            font-size: 12px;
            font-style: italic;
        }
    </style>

    <!-- Centre -->
    <circle cx="600" cy="600" r="3" fill="currentFill" />

    <!-- 1. Ordinary World -->
    <line class="line" x1="600" y1="600" x2="600" y2="240" />
    <rect class="box" x="450" y="200" width="300" height="80" />
    <text class="title" x="600" y="222">Ordinary World</text>
    <text class="text" x="600" y="242">Personal rule of Charles I</text>
    <text class="date" x="600" y="262">1629–1640 - Proclamations &amp; sermons</text>

    <!-- 2. Call to Adventure -->
    <line class="line" x1="600" y1="600" x2="780" y2="288" />
    <rect class="box" x="650" y="248" width="260" height="80" />
    <text class="title" x="780" y="270">Call to Adventure</text>
    <text class="text" x="780" y="290">Breakdown of royal authority</text>
    <text class="date" x="780" y="310">1640–1642 - Petitions &amp; pamphlets</text>

    <!-- 3. Refusal of the Call -->
    <line class="line" x1="600" y1="600" x2="912" y2="420" />
    <rect class="box" x="782" y="380" width="260" height="80" />
    <text class="title" x="912" y="402">Refusal of the Call</text>
    <text class="text" x="912" y="422">Attempts to preserve monarchy</text>
    <text class="date" x="912" y="442">1641–1642 - Royal declarations</text>

    <!-- 4. Meeting the Mentor -->
    <line class="line" x1="600" y1="600" x2="960" y2="600" />
    <rect class="box" x="830" y="560" width="260" height="80" />
    <text class="title" x="960" y="582">Meeting the Mentor</text>
    <text class="text" x="960" y="602">Parliamentary ideology forms</text>
    <text class="date" x="960" y="622">1642–1644 - Newsbooks</text>

    <!-- 5. Crossing the Threshold -->
    <line class="line" x1="600" y1="600" x2="912" y2="780" />
    <rect class="box" x="782" y="740" width="260" height="80" />
    <text class="title" x="912" y="762">Crossing the Threshold</text>
    <text class="text" x="912" y="782">Civil war becomes total</text>
    <text class="date" x="912" y="802">1643–1645 - Ordinances</text>

    <!-- 6. Tests, Allies, Enemies -->
    <line class="line" x1="600" y1="600" x2="780" y2="912" />
    <rect class="box" x="650" y="872" width="260" height="80" />
    <text class="title" x="780" y="894">Tests, Allies, Enemies</text>
    <text class="text" x="780" y="914">Factionalisation &amp; New Model Army</text>
    <text class="date" x="780" y="934">1644–1647 - Military tracts</text>

    <!-- 7. Approach to the Inmost Cave -->
    <line class="line" x1="600" y1="600" x2="600" y2="960" />
    <rect class="box" x="450" y="920" width="300" height="80" />
    <text class="title" x="600" y="942">Approach to the Inmost Cave</text>
    <text class="text" x="600" y="962">Trial of sovereignty itself</text>
    <text class="date" x="600" y="982">1648 - Army remonstrances</text>

    <!-- 8. Ordeal -->
    <line class="line" x1="600" y1="600" x2="420" y2="912" />
    <rect class="box" x="290" y="872" width="260" height="80" />
    <text class="title" x="420" y="894">Ordeal</text>
    <text class="text" x="420" y="914">Regicide</text>
    <text class="date" x="420" y="934">1649 - Act establishing the High Court</text>

    <!-- 9. Reward -->
    <line class="line" x1="600" y1="600" x2="288" y2="780" />
    <rect class="box" x="158" y="740" width="260" height="80" />
    <text class="title" x="288" y="762">Reward</text>
    <text class="text" x="288" y="782">Commonwealth proclaimed</text>
    <text class="date" x="288" y="802">1649–1653 - Acts &amp; proclamations</text>

    <!-- 10. Road Back -->
    <line class="line" x1="600" y1="600" x2="240" y2="600" />
    <rect class="box" x="110" y="560" width="260" height="80" />
    <text class="title" x="240" y="582">The Road Back</text>
    <text class="text" x="240" y="602">Restoration of monarchy</text>
    <text class="date" x="240" y="622">1660 - Declaration of Breda</text>

    <!-- 11. Resurrection -->
    <line class="line" x1="600" y1="600" x2="288" y2="420" />
    <rect class="box" x="158" y="380" width="260" height="80" />
    <text class="title" x="288" y="402">Resurrection</text>
    <text class="text" x="288" y="422">Crisis of absolutism returns</text>
    <text class="date" x="288" y="442">1685–1688 - Royal dispensations</text>

    <!-- 12. Return with the Elixir -->
    <line class="line" x1="600" y1="600" x2="420" y2="288" />
    <rect class="box" x="290" y="248" width="260" height="80" />
    <text class="title" x="420" y="270">Return with the Elixir</text>
    <text class="text" x="420" y="290">Constitutional settlement</text>
    <text class="date" x="420" y="310">1689 - Bill of Rights</text>

</svg>
