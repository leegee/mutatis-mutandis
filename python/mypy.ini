[mypy]
python_version = 3.11

# Keep useful checking
ignore_missing_imports = True
disallow_untyped_defs = False
check_untyped_defs = True

warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True

# You already disabled this (good for ML code)
disable_error_code = no-any-return

# --- ADD THIS ---
# Transformers / torch typing is noisy and often wrong
[mypy-transformers.*]
ignore_errors = True

[mypy-torch.*]
ignore_errors = True

# Optional but often needed with FAISS
[mypy-faiss.*]
ignore_errors = True

# Your existing module
[mypy-fastText_eebo.*]
ignore_errors = True

# --- OPTIONAL: target just this file instead of global ignores ---
# Use this IF you want to keep transformers typed elsewhere
# Replace with your actual module path if needed
[mypy-src.slice_embedding_pipeline]
disable_error_code = arg-type
