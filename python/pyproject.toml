[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eebo"
version = "0.5.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bertopic==0.17.4",
    "faiss-cpu==1.14.3",
    "fastapi==0.138.0",
    "flask==3.1.3",
    "hdbscan==0.8.44",
    "huggingface-hub==0.36.2",
    "igraph==1.0.0",
    "keybert==0.9.0",
    "langdetect==1.0.9",
    "leidenalg==0.12.0",
    "matplotlib==3.10.9",
    "networkx==3.6.1",
    "nltk==3.9.4",
    "numpy==2.4.5",
    "onnx==1.22.0",
    "onnx-ir==0.2.1",
    "onnxruntime-directml==1.24.4",
    "onnxscript==0.7.1",
    "optimum==2.1.0",
    "optimum-onnx==0.1.0",
    "pandas==3.0.3",
    "pacmap==0.9.1",
    "plotly==6.9.0",
    "psycopg==3.3.4",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "sentence-transformers==5.6.0",
    "torch==2.13.0+cpu",
    "transformers==4.57.6",
    "umap-learn==0.5.12",
    "uvicorn==0.51.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "F",   # pyflakes (real bugs)
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "B",   # bugbear
  "A",   # shadow builtins
]

ignore = [
  "E501",  # line length
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

